<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dice Masters hand</title>
<style>
:root{--ink:#12151B;--panel:#1A1F28;--raised:#232A35;--line:#2A313D;--tx:#E6E9EE;--mut:#8B95A6;--ok:#4FA055;--gold:#F2C14E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
header{position:sticky;top:0;background:var(--ink);padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;z-index:2;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--mut);font-size:13.5px}.sub b{color:var(--gold);font-weight:600}.sub em{font-style:normal;color:var(--gold)}
.hb{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:10px}
.hb:empty{display:none}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--panel)}
.seg button{height:38px;padding:0 16px;border-radius:999px;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--ink);font-weight:600}
.hn{flex:1;min-width:0;color:var(--mut);font-size:14px}
.lk,.chg{margin-left:auto;height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:600}
.lk{background:var(--gold);color:#12151B;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.chg{border:1px solid var(--line);color:var(--mut)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px;padding:14px 0}
.c{position:relative;display:flex;flex-direction:column;min-width:0}
.zo{display:block;width:100%;position:relative;border-radius:7px}
.pic{position:relative;aspect-ratio:18/25;border-radius:7px;overflow:hidden;background:var(--panel);border:2px solid transparent}
.pic .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;padding:8px 7px;border-top:4px solid var(--e);display:flex;flex-direction:column;gap:3px;font-size:12px;text-align:left}.ph b{font-size:22px}.ph i{font-style:normal;color:var(--mut);margin-top:auto;font-size:11px}
.c.on .pic{border-color:var(--ok)}
.nm{font-size:12.5px;margin-top:6px;min-width:0}
.chn,.cdn{display:block;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 6px;line-height:1.3}
.chn{background:var(--gold);color:#12151B;font-weight:700}.cdn{border:1px solid #3A4250;margin-top:3px}
.nm small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
.pk{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;height:42px;border:1.5px solid var(--line);border-radius:21px;font-size:14px;font-weight:600;color:var(--mut)}
.c .pk{margin-top:8px}
.pk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.dl{margin-top:8px;font-size:14px;font-weight:600;color:var(--gold)}.dl i{font-style:normal;font-weight:400;color:var(--mut)}.dl small{display:block;font-size:11.5px;font-weight:400;color:var(--mut);margin-top:2px}
.ds{display:flex;gap:8px;margin-top:7px}.ds button{flex:1;height:42px;border-radius:21px;background:var(--raised);font-size:22px;line-height:1}
h2{font-size:13px;letter-spacing:.06em;color:var(--mut);margin:12px 0 0;text-transform:uppercase}
.bar{display:flex;gap:10px;margin-top:8px}.bar button{flex:1;padding:13px;border:1px solid var(--line);border-radius:12px;font-weight:600}
.msg{color:var(--mut);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.msg.w{color:var(--gold)}
.send{margin:12px 0 0;padding:12px;border:1px solid var(--gold);border-radius:12px}.send p{margin:0 0 10px;font-size:14px}.send .bar{margin:0}.send a{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:600;text-align:center;color:var(--tx);text-decoration:none}.send .p{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.tnl{display:block;margin:12px 0 0;font-size:13px;color:var(--mut)}.tnl input{display:block;width:100%;margin-top:6px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px}
/* the close-up: one card big, swipe sideways through the hand, swipe down or Back to close */
.zv{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#08090C;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));touch-action:none}
.zv[hidden]{display:none}
.zt{display:flex;align-items:center;gap:10px;min-height:48px}
.zt span{flex:1;min-width:0;color:var(--mut);font-size:14px}
.zx{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1}
.zs{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zs .pic{width:min(100%,460px,calc((100dvh - 330px) * .72));border-width:3px}
.zs.in-l .pic{animation:zl .28s ease-out}.zs.in-r .pic{animation:zr .28s ease-out}
@keyframes zl{from{transform:translateX(40px);opacity:.3}}@keyframes zr{from{transform:translateX(-40px);opacity:.3}}
.zs .nm{display:flex;flex-direction:column;align-items:center;font-size:17px;margin-top:10px}.zs .nm small{font-size:13px}
.zf{margin-top:6px;color:var(--mut);font-size:13px;text-align:center}
.zd{display:flex;align-items:center;gap:10px;margin-top:12px}
.zd>span:first-child{flex:none;font-size:14px;color:var(--mut)}
.zd .seg{flex:1;display:flex}.zd .seg button{flex:1;padding:0;min-width:0;height:44px;font-size:17px}
.zd .seg button:disabled{opacity:.25}
.zb{display:flex;gap:10px;align-items:center;margin-top:10px}
.zn{flex:none;width:52px;height:52px;border-radius:26px;border:1px solid var(--line);font-size:22px}
.zb .pk{flex:1;height:52px;margin:0;border-radius:26px;font-size:16px}
.zb .gap{flex:1;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><h1 id="t">Loading…</h1><div class="sub" id="s"></div><div class="hb" id="hb"></div></header>
<div id="send"></div><div id="tn"></div><main id="m"></main>
<script>
/* A dealt Dice Masters hand. Everything about the hand is in the link:
   #n=<player name>&d=<date dealt>&k=<cards to keep, 0 = keep all>&c=<card ids>&b=<basic action ids>&p=<pre-picked ids>
   &x=<most dice each card can have in this hand>&u=<dice already chosen per card>&l=1 (team already locked in)
   x, u and l are newer: older links still open, and their dice go up to the card's printed max.
   Card names and facts come from cards.json, pictures from cards/<id>.jpg.
   Everything the app does with a team is here: pick, see only the picked cards, look at any card up close,
   choose the dice to field (20 for the team), lock the team in, and copy it back set by set. */
(function(){
  var q={}; location.hash.replace(/^#/,'').split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); });
  var ids=function(s){ return (s||'').split('.').filter(Boolean).map(Number); };
  var nums=function(s){ return s? s.split('.').map(function(x){ return +x||0; }) : []; };
  var dealt=''; if(/^\d{4}-\d\d-\d\d$/.test(q.d||'')){ var dd=new Date(q.d+'T12:00:00'); dealt=dd.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  var sender=q.s==='1', name=q.n||'Player', keep=+q.k||0, cids=ids(q.c), bids=ids(q.b), pre=ids(q.p), avail=nums(q.x), want=nums(q.u), CAP=20;
  var K='dmhand-'+[name].concat(cids).join('.'), TK=K+'-name', tname=''; try{ tname=localStorage.getItem(TK)||''; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function dw(n){ return n+(n===1?' die':' dice'); }
  if(!cids.length){ document.getElementById('t').textContent='No hand in this link'; document.getElementById('s').textContent='Ask for the link again: it may have been cut short.'; return; }
  fetch('cards.json').then(function(r){ return r.json(); }).then(function(J){
    function card(id){ var a=J.cards[id]; if(!a) return {id:id, n:'Card '+id, ch:'', s:'', sn:'', k:'', e:'#6B7483'};
      return {id:id, ch:a[0], n:a[1], s:a[2], sn:J.sets[a[2]]||a[2], k:a[3], e:a[4], at:a[5], no:a[6]||'', r:a[7]||'', mx:a[8]||0, af:a[9]||'', en:a[10]||''}; }
    var D={cards:cids.map(card), bacs:bids.map(card)}, view='all';
    // this phone's picks, dice and lock, kept between visits
    var S={p:{}, u:{}, l:false}, st=null;
    try{ st=JSON.parse(localStorage.getItem(K+'-v2')||'null'); }catch(e){}
    if(st){ (st.p||[]).forEach(function(i){ if(i<D.cards.length) S.p[i]=1; }); S.u=st.u||{}; S.l=!!st.l; }
    else { var old=null; try{ old=JSON.parse(localStorage.getItem(K)||'null'); }catch(e){}
      if(old) old.forEach(function(i){ if(i<D.cards.length) S.p[i]=1; });
      else D.cards.forEach(function(c,i){ if(pre.indexOf(c.id)>=0) S.p[i]=1; });
      want.forEach(function(v,i){ if(v && i<D.cards.length) S.u[i]=v; }); S.l=q.l==='1'; }
    function save(){ try{ localStorage.setItem(K+'-v2',JSON.stringify({p:Object.keys(S.p).map(Number), u:S.u, l:S.l})); }catch(e){} }
    function n(){ return Object.keys(S.p).length; }
    function inTeam(i){ return !keep || !!S.p[i]; }
    function maxFor(i){ var c=D.cards[i], a=avail[i]||0; return c.mx&&a? Math.min(c.mx,a) : (c.mx||a||CAP); }
    function useOf(i){ return Math.min(S.u[i]||0,maxFor(i)); }
    function tot(){ var t={n:0,cost:0,dice:0}; D.cards.forEach(function(c,i){ if(!inTeam(i)) return; t.n++; t.cost+=Math.max(0,+c.k||0); t.dice+=useOf(i); }); return t; }
    function ready(){ return !keep || n()===keep; }
    function onlyTeam(){ return S.l || (keep && view==='picked' && n()>0); }
    function shown(){ var o=[]; D.cards.forEach(function(c,i){ if(!onlyTeam() || inTeam(i)) o.push({c:c,i:i}); }); return o; }
    function zList(){ return shown().concat(D.bacs.map(function(c){ return {c:c,i:-1}; })); }
    function dicing(){ return S.l || !keep; }
    // most dice this card may take now: its own limit, and what's left of the team's 20
    function room(i){ var mx=maxFor(i); if(!inTeam(i)) return mx; return Math.min(mx, CAP-(tot().dice-useOf(i))); }
    function setUse(i,v){ var mx=maxFor(i), old=useOf(i); v=Math.max(0,Math.min(mx,v|0));
      if(v>old && inTeam(i)) v=Math.min(v,Math.max(old,room(i)));
      if(v===old) return v<mx && inTeam(i) && tot().dice>=CAP? 'Your team has all '+CAP+' dice. Take one off another card first.' : '';
      if(v) S.u[i]=v; else delete S.u[i]; save(); return ''; }
    function togglePick(i){ if(S.l) return ''; if(S.p[i]) delete S.p[i]; else if(n()<keep) S.p[i]=1; else return 'You have '+keep+'. Untick one first.'; save(); return ''; }
    function pic(c){
      return '<div class="pic" style="--e:'+c.e+'"><div class="ph"><b>'+(c.k<0?'':c.k)+'</b><span>'+esc(c.ch)+'</span><span style="color:#8B95A6">'+esc(c.n)+'</span><i>'+esc(c.s)+'</i></div>'
        +(c.at?'<img class="im" src="cards/'+c.id+'.jpg" alt="" onerror="this.remove()">':'')+'</div>'; }
    function label(c,full){ return '<div class="nm"><span class="chn">'+esc(c.ch)+'</span>'+(c.n&&c.n!==c.ch?'<span class="cdn">'+esc(c.n)+'</span>':'')
      +'<small>'+esc(full? c.sn+' ('+c.s+')' : c.s)+(c.no?' &middot; #'+esc(c.no):'')+'</small></div>'; }
    function render(){
      var T=tot();
      document.title=name+'’s Dice Masters hand';
      document.getElementById('t').textContent=name+'’s hand';
      document.getElementById('s').innerHTML=(dealt?'Dealt '+esc(dealt)+'. ':'')
        +(S.l? '<b>Locked in.</b> Cost '+T.cost
          : keep? 'Pick '+keep+' of these '+D.cards.length+'. Picked '+n()+' of '+keep+(n()?' &middot; cost '+T.cost:'')
          : 'Your team: '+D.cards.length+' cards plus '+D.bacs.length+' basic actions. Cost '+T.cost)
        +(T.dice? ' &middot; <em>'+T.dice+' of '+CAP+' dice</em>' : '')+'. Tap a card to see it up close.';
      document.getElementById('hb').innerHTML= S.l? '<span class="hn">Your team for this match</span><button class="chg" data-lock="1">'+(keep?'Change picks':'Change team')+'</button>'
        : (keep? '<span class="seg" role="group" aria-label="Cards shown"><button data-v="all" aria-pressed="'+!onlyTeam()+'">All '+D.cards.length+'</button><button data-v="picked" aria-pressed="'+onlyTeam()+'"'+(n()?'':' disabled')+'>Picked '+n()+'</button></span>' : '')
          +(ready()? '<button class="lk" data-lock="1">&#10003; Lock in team</button>' : '');
      var h='<div class="grid">'+shown().map(function(x,j){ var c=x.c, i=x.i, u=useOf(i), mx=maxFor(i);
        return '<div class="c'+(keep&&S.p[i]&&!S.l?' on':'')+'"><button class="zo" data-z="'+j+'" aria-label="See '+esc(c.ch)+' up close">'+pic(c)+'</button>'+label(c)
          +(dicing()? '<div class="dl">'+(u? dw(u) : '<i>No dice yet</i>')+'<small>'+(c.mx||avail[i]? 'up to '+mx : 'max is on the card')+'</small></div>'
              +'<div class="ds"><button data-d="'+i+':-1" aria-label="One die fewer"'+(u<=0?' disabled':'')+'>&minus;</button><button data-d="'+i+':1" aria-label="One more die"'+(u>=mx||(inTeam(i)&&T.dice>=CAP)?' disabled':'')+'>+</button></div>'
            : '<button class="pk" data-p="'+i+'" aria-pressed="'+!!S.p[i]+'">'+(S.p[i]?'&#10003; Picked':'Pick')+'</button>')+'</div>'; }).join('')+'</div>';
      var off=shown().length;
      h+='<h2>Basic actions (yours)</h2><div class="grid">'+D.bacs.map(function(c,j){ return '<div class="c"><button class="zo" data-z="'+(off+j)+'" aria-label="See '+esc(c.ch)+' up close">'+pic(c)+'</button>'+label(c)+'</div>'; }).join('')+'</div>';
      h+='<div class="bar"><button data-copy="1">Copy my team</button></div><div class="msg" id="msg"></div>';
      document.getElementById('m').innerHTML=h;
    }
    // the team as text, set by set with card numbers, so the dealer can pull it from the boxes
    function teamText(){
      var T=tot(), sets={}, order=[];
      function add(c,line){ if(!sets[c.s]){ sets[c.s]={sn:c.sn, lines:[]}; order.push(c.s); } sets[c.s].lines.push(line); }
      D.cards.forEach(function(c,i){ if(!inTeam(i)) return; var u=useOf(i); add(c,'  '+(c.no?'#'+c.no+' ':'')+c.ch+(c.n&&c.n!==c.ch?': '+c.n:'')+(u?', '+dw(u):'')); });
      D.bacs.forEach(function(c){ add(c,'  '+(c.no?'#'+c.no+' ':'')+(c.ch==='Basic Action Card'? c.n : c.ch)+' (basic action)'); });
      order.sort(function(a,b){ return String(sets[a].sn).localeCompare(String(sets[b].sn)); });
      var head=(tname? tname+' ('+name+'’s team)' : name+'’s team')+(dealt?', dealt '+dealt:'')+(S.l?', locked in':keep&&n()<keep?', '+n()+' of '+keep+' picked so far':'')
        +'. Cost '+T.cost+(T.dice?', '+T.dice+' of '+CAP+' dice':'')+'.';
      return head+'\n'+order.map(function(s){ return sets[s].sn+' ('+s+')\n'+sets[s].lines.join('\n'); }).join('\n');
    }
    function note(t){ var m=document.getElementById(zv?'zmsg':'msg'); if(m){ m.textContent=t; m.className='msg'+(t?' w':''); } }
    // the close-up
    var zv=null, zEl=document.createElement('div'); zEl.className='zv'; zEl.hidden=true; zEl.setAttribute('role','dialog'); zEl.setAttribute('aria-modal','true'); zEl.setAttribute('aria-label','Card up close');
    document.body.appendChild(zEl);
    function zRender(dir){ var L=zList(); if(!L.length){ zClose(); return; } if(zv.at>=L.length) zv.at=L.length-1;
      var x=L[zv.at], c=x.c, i=x.i, T=tot(), d='';
      if(i>=0){ var mx=maxFor(i), u=useOf(i), rm=room(i), sg='';
        if(mx<=8){ for(var k=1;k<=mx;k++) sg+='<button data-zd="'+k+'" aria-pressed="'+(u===k)+'" aria-label="Field '+dw(k)+'"'+(k>rm&&k!==u?' disabled':'')+'>'+k+'</button>'; }
        else sg='<button data-zd="'+(u-1)+'"'+(u<=0?' disabled':'')+' aria-label="One die fewer">&minus;</button><button aria-pressed="true">'+u+'</button><button data-zd="'+(u+1)+'"'+(u>=rm?' disabled':'')+' aria-label="One more die">+</button>';
        d='<div class="zd"><span>Dice</span><span class="seg" role="group" aria-label="Dice to field">'+sg+'</span></div>'; }
      var facts=[c.k!==''&&c.k>=0?'Cost '+c.k:'', c.en, c.r, i>=0&&c.mx?'Max '+dw(c.mx):'', c.af].filter(Boolean).map(esc).join(' &middot; ');
      zEl.innerHTML='<div class="zt"><span>'+(zv.at+1)+' of '+L.length+(keep&&!S.l? ' &middot; picked '+n()+' of '+keep : '')+(T.dice? ' &middot; '+T.dice+' of '+CAP+' dice' : '')+'</span><button class="zx" data-zx="1" aria-label="Close">&times;</button></div>'
        +'<div class="zs'+(dir? (dir>0?' in-l':' in-r') : '')+'">'+pic(c)+label(c,true)+(facts?'<div class="zf">'+facts+'</div>':'')+'</div>'+d
        +'<div class="zb"><button class="zn" data-zgo="-1" aria-label="Previous card"'+(zv.at>0?'':' disabled')+'>&lsaquo;</button>'
        +(i>=0&&keep&&!S.l? '<button class="pk" data-p="'+i+'" aria-pressed="'+!!S.p[i]+'">'+(S.p[i]?'&#10003; Picked':'Pick this card')+'</button>' : '<span class="gap">'+(i<0? 'Basic action' : 'Swipe for the next')+'</span>')
        +'<button class="zn" data-zgo="1" aria-label="Next card"'+(zv.at<L.length-1?'':' disabled')+'>&rsaquo;</button></div><div class="msg" id="zmsg"></div>';
    }
    function zOpen(at){ var was=!!zv; zv={at:at}; zEl.hidden=false; document.body.style.overflow='hidden'; zRender();
      if(!was){ try{ history.pushState({zv:1},''); }catch(e){} } }
    function zShut(){ zv=null; zEl.hidden=true; zEl.innerHTML=''; document.body.style.overflow=''; }
    function zClose(){ if(!zv) return; if(history.state && history.state.zv) history.back(); else zShut(); }
    window.addEventListener('popstate',function(){ if(zv) zShut(); });
    function zGo(d){ if(!zv) return; var L=zList(), na=zv.at+d; if(na<0||na>=L.length) return; zv.at=na; zRender(d); }
    document.addEventListener('keydown',function(e){ if(!zv) return; if(e.key==='Escape') zClose(); if(e.key==='ArrowRight') zGo(1); if(e.key==='ArrowLeft') zGo(-1); });
    var zx0=null, zy0=null;
    zEl.addEventListener('touchstart',function(e){ zx0=e.touches[0].clientX; zy0=e.touches[0].clientY; },{passive:true});
    zEl.addEventListener('touchend',function(e){ if(zx0==null) return; var dx=e.changedTouches[0].clientX-zx0, dy=e.changedTouches[0].clientY-zy0; zx0=null;
      if(Math.abs(dx)>45 && Math.abs(dx)>1.3*Math.abs(dy)) zGo(dx<0?1:-1); else if(dy>90 && dy>2*Math.abs(dx)) zClose(); });
    document.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b || b.disabled) return; var w='';
      if(b.dataset.v){ view=b.dataset.v; render(); window.scrollTo(0,0); return; }
      if(b.dataset.lock){ S.l=!S.l; view='all'; save(); render(); window.scrollTo(0,0); if(S.l && navigator.vibrate) navigator.vibrate([12,40,12]); return; }
      if(b.dataset.p!=null){ w=togglePick(+b.dataset.p); render(); if(zv) zRender(); note(w); return; }
      if(b.dataset.d){ var dv=b.dataset.d.split(':'); w=setUse(+dv[0],useOf(+dv[0])+(+dv[1])); render(); note(w); return; }
      if(b.dataset.zd!=null){ var zi=zList()[zv.at].i, val=+b.dataset.zd; if(b.getAttribute('aria-pressed')==='true') val=0;
        w=setUse(zi,val); render(); zRender(); note(w); return; }
      if(b.dataset.z!=null){ zOpen(+b.dataset.z); return; }
      if(b.dataset.zgo){ zGo(+b.dataset.zgo); return; }
      if(b.dataset.zx){ zClose(); return; }
      if(b.dataset.copy){ var txt=teamText();
        (navigator.clipboard&&navigator.clipboard.writeText? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ note('Copied, set by set. Paste it in a text back to the dealer.'); },
          function(){ note('Couldn’t copy here. Take a screenshot instead.'); }); }
    });
    document.getElementById('tn').innerHTML='<label class="tnl">Name your team<input id="tname" maxlength="30" placeholder="e.g. Cosmic Smash" value="'+esc(tname)+'"></label>';
    document.addEventListener('input',function(e){ if(e.target.id==='tname'){ tname=e.target.value.trim(); try{ localStorage.setItem(TK,tname); }catch(x){} } });
    if(sender){
      // opened by the dealer from the app: offer to send the hand, without this flag in the link
      var share=location.href.split('#')[0]+'#'+location.hash.slice(1).split('&').filter(function(kv){ return kv!=='s=1'; }).join('&');
      var text=name+', here is your Dice Masters hand'+(dealt?' from '+dealt.replace(/, \d{4}$/,''):'')+': '+share;
      document.getElementById('send').innerHTML='<div class="send"><p>Send this hand to '+esc(name)+'.</p><div class="bar">'
        +(navigator.share?'<button class="p" data-send="share">Share…</button>':'')
        +'<a'+(navigator.share?'':' class="p"')+' href="sms:?&body='+encodeURIComponent(text)+'">Text message</a>'
        +'<button data-send="copy">Copy link</button></div><div class="msg" id="smsg"></div></div>';
      document.getElementById('send').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; var m=document.getElementById('smsg');
        if(b.dataset.send==='share') navigator.share({title:name+'’s Dice Masters hand', text:text}).then(function(){ m.textContent='Sent.'; },function(){});
        if(b.dataset.send==='copy') (navigator.clipboard? navigator.clipboard.writeText(share) : Promise.reject()).then(function(){ m.textContent='Link copied. Paste it into a text.'; },function(){ m.textContent='Couldn’t copy. Press and hold the address bar to copy it.'; });
      });
    }
    render();
  }).catch(function(){ document.getElementById('t').textContent='Couldn’t load the cards'; document.getElementById('s').textContent='Check the connection and reload.'; });
})();
</script>
</body>
</html>
