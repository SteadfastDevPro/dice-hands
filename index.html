<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dice Masters hand</title>
<style>
:root{--ink:#12151B;--panel:#1A1F28;--line:#2A313D;--tx:#E6E9EE;--mut:#8B95A6;--ok:#4FA055;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:sticky;top:0;background:var(--ink);padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--mut);font-size:13.5px}
.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--mut)}
.tabs button[aria-pressed=true]{background:var(--tx);color:var(--ink);border-color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 10px;padding:14px 0}
.c{position:relative;text-align:left;min-width:0}
.pic{position:relative;aspect-ratio:18/25;border-radius:7px;overflow:hidden;background:var(--panel);border:2px solid transparent}
.pic .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;padding:8px 7px;border-top:4px solid var(--e);display:flex;flex-direction:column;gap:3px;font-size:12px}.ph b{font-size:22px}.ph i{font-style:normal;color:var(--mut);margin-top:auto;font-size:11px}
.c.on .pic{border-color:var(--ok)}
.c .tk{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:13px;background:var(--ink);border:2px solid var(--mut);display:grid;place-items:center;font-size:14px;color:transparent;z-index:1}
.c.on .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.nm{font-size:12.5px;margin-top:5px;min-width:0}
.chn,.cdn{display:block;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 6px;line-height:1.3}
.chn{background:#F2C14E;color:#12151B;font-weight:700}.cdn{border:1px solid #3A4250;margin-top:3px}
.nm small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
h2{font-size:13px;letter-spacing:.06em;color:var(--mut);margin:16px 0 0;text-transform:uppercase}
.swipe{padding:14px 0;text-align:center;touch-action:none}
.swipe .pic{width:min(100%,360px,calc((100dvh - 290px) * .72));margin:0 auto}
.swipe .nm{display:flex;flex-direction:column;align-items:center;font-size:17px}
.swipe .nm small{font-size:13px}
.bar{display:flex;gap:10px;margin-top:8px}.bar button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.msg{color:var(--mut);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.send{margin:12px 0 0;padding:12px;border:1px solid #F2C14E;border-radius:12px}.send p{margin:0 0 10px;font-size:14px}.send .bar{margin:0}.send a{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:600;text-align:center;color:var(--tx);text-decoration:none}.send .p{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.tnl{display:block;margin:12px 0 0;font-size:13px;color:var(--mut)}.tnl input{display:block;width:100%;margin-top:6px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.zo{display:block;width:100%;position:relative;border-radius:7px}
.pk{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;height:40px;margin-top:7px;border:1.5px solid var(--line);border-radius:20px;font-size:14px;font-weight:600;color:var(--mut)}
.pk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
/* the close-up: one card big, swipe sideways through the hand, swipe down or Back to close */
.zv{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#08090C;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));touch-action:none}
.zv[hidden]{display:none}
.zt{display:flex;align-items:center;gap:10px;min-height:48px}
.zt span{flex:1;min-width:0;color:var(--mut);font-size:14px}
.zx{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1}
.zs{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zs .pic{width:min(100%,460px,calc((100dvh - 250px) * .72));border-width:3px}
.zs.in-l .pic{animation:zl .28s ease-out}.zs.in-r .pic{animation:zr .28s ease-out}
@keyframes zl{from{transform:translateX(40px);opacity:.3}}@keyframes zr{from{transform:translateX(-40px);opacity:.3}}
.zs .nm{display:flex;flex-direction:column;align-items:center;font-size:17px;margin-top:10px}.zs .nm small{font-size:13px}
.zb{display:flex;gap:10px;align-items:center;margin-top:12px}
.zn{flex:none;width:52px;height:52px;border-radius:26px;border:1px solid var(--line);font-size:22px}
.zn:disabled{opacity:.3}
.zb .pk{flex:1;height:52px;margin:0;border-radius:26px;font-size:16px}
.zb .gap{flex:1;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><h1 id="t">Loading…</h1><div class="sub" id="s"></div><div class="tabs" id="tabs"></div></header>
<div id="send"></div><div id="tn"></div><main id="m"></main>
<script>
/* A dealt Dice Masters hand. Everything about the hand is in the link:
   #n=<player name>&k=<cards to keep, 0 = keep all>&c=<card ids>&b=<basic action ids>&p=<pre-picked ids>
   Card names come from cards.json, pictures from cards/<id>.jpg. */
(function(){
  var q={}; location.hash.replace(/^#/,'').split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); });
  var ids=function(s){ return (s||'').split('.').filter(Boolean).map(Number); };
  var dealt=''; if(/^\d{4}-\d\d-\d\d$/.test(q.d||'')){ var dd=new Date(q.d+'T12:00:00'); dealt=dd.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  var sender=q.s==='1', name=q.n||'Player', keep=+q.k||0, cids=ids(q.c), bids=ids(q.b), pre=ids(q.p);
  var K='dmhand-'+[name].concat(cids).join('.'), TK=K+'-name', tname=''; try{ tname=localStorage.getItem(TK)||''; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  if(!cids.length){ document.getElementById('t').textContent='No hand in this link'; document.getElementById('s').textContent='Ask for the link again: it may have been cut short.'; return; }
  fetch('cards.json').then(function(r){ return r.json(); }).then(function(J){
    function card(id){ var a=J.cards[id]; if(!a) return {id:id, n:'Card '+id, ch:'', s:'', sn:'', k:'', e:'#6B7483'};
      return {id:id, ch:a[0], n:a[1], s:a[2], sn:J.sets[a[2]]||a[2], k:a[3], e:a[4], at:a[5]}; }
    var D={cards:cids.map(card), bacs:bids.map(card)}, picked={}, view=keep?'pick':'team', at=0;
    var stored=null; try{ stored=JSON.parse(localStorage.getItem(K)||'null'); }catch(e){}
    (stored||[]).forEach(function(i){ if(i<D.cards.length) picked[i]=1; });
    if(!stored) D.cards.forEach(function(c,i){ if(pre.indexOf(c.id)>=0) picked[i]=1; });
    if(keep && Object.keys(picked).length>=keep && !stored) view='team';
    function save(){ try{ localStorage.setItem(K,JSON.stringify(Object.keys(picked).map(Number))); }catch(e){} }
    function n(){ return Object.keys(picked).length; }
    function team(){ var t=keep? D.cards.filter(function(c,i){ return picked[i]; }) : D.cards.slice(); return t.concat(D.bacs); }
    function pic(c){
      return '<div class="pic" style="--e:'+c.e+'"><div class="ph"><b>'+(c.k<0?'':c.k)+'</b><span>'+esc(c.ch)+'</span><span style="color:#8B95A6">'+esc(c.n)+'</span><i>'+esc(c.s)+'</i></div>'
        +(c.at?'<img class="im" src="cards/'+c.id+'.jpg" alt="" onerror="this.remove()">':'')+'</div>'; }
    function label(c,full){ return '<div class="nm"><span class="chn">'+esc(c.ch)+'</span>'+(c.n&&c.n!==c.ch?'<span class="cdn">'+esc(c.n)+'</span>':'')+'<small>'+esc(full? c.sn+' ('+c.s+')' : c.s)+'</small></div>'; }
    function render(){
      document.title=name+'’s Dice Masters hand';
      document.getElementById('t').textContent=name+'’s hand';
      document.getElementById('s').textContent= (dealt?'Dealt '+dealt+'. ':'')+(keep? (n()<keep? 'Pick '+keep+' of these '+D.cards.length+' cards. Picked '+n()+' of '+keep+'. Tap a card to see it up close.' : 'Team complete: '+keep+' cards picked, plus '+D.bacs.length+' basic actions.')
        : 'Your team: '+D.cards.length+' cards plus '+D.bacs.length+' basic actions.');
      var tabs=(keep?[['pick','Pick']]:[]).concat([['team','My team'],['swipe','One by one']]);
      document.getElementById('tabs').innerHTML=tabs.map(function(t){ return '<button data-v="'+t[0]+'" aria-pressed="'+(view===t[0])+'">'+t[1]+'</button>'; }).join('');
      var h='';
      if(view==='pick'){
        h='<div class="grid">'+D.cards.map(function(c,i){ return '<div class="c'+(picked[i]?' on':'')+'"><button class="zo" data-z="'+i+'" aria-label="See '+esc(c.ch)+' up close"><span class="tk">&#10003;</span>'+pic(c)+'</button>'+label(c)
            +'<button class="pk" data-p="'+i+'" aria-pressed="'+!!picked[i]+'">'+(picked[i]?'&#10003; Picked':'Pick')+'</button></div>'; }).join('')+'</div>'
          +'<h2>Basic actions (yours)</h2><div class="grid">'+D.bacs.map(function(c,j){ return '<div class="c"><button class="zo" data-z="'+(D.cards.length+j)+'" aria-label="See '+esc(c.ch)+' up close">'+pic(c)+'</button>'+label(c)+'</div>'; }).join('')+'</div>';
      } else {
        var T=team();
        if(keep && !n()) h='<div class="empty">No cards picked yet. Pick them under Pick.</div>';
        else if(view==='team') h='<div class="grid">'+T.map(function(c,j){ return '<div class="c"><button class="zo" data-z="'+j+'" aria-label="See '+esc(c.ch)+' up close">'+pic(c)+'</button>'+label(c)+'</div>'; }).join('')+'</div>';
        else { if(at>=T.length) at=T.length-1; if(at<0) at=0; var c=T[at];
          h='<div class="swipe" id="sw"><div class="msg">Card '+(at+1)+' of '+T.length+' · swipe for the next</div>'+pic(c)+label(c,true)+'</div>'; }
        h+='<div class="bar"><button data-copy="1">Copy my team</button></div><div class="msg" id="msg"></div>';
      }
      document.getElementById('m').innerHTML=h;
    }
    document.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
      if(b.dataset.v){ view=b.dataset.v; at=0; render(); window.scrollTo(0,0); return; }
      if(b.dataset.p!=null){ var i=+b.dataset.p; if(picked[i]) delete picked[i]; else if(n()<keep) picked[i]=1; else { flash('You have '+keep+'. Untick one first.'); return; }
        save(); render(); if(zv) zRender(); return; }
      if(b.dataset.z!=null){ zOpen(+b.dataset.z); return; }
      if(b.dataset.zgo){ zGo(+b.dataset.zgo); return; }
      if(b.dataset.zx){ zClose(); return; }
      if(b.dataset.copy){ var txt=(tname? tname+' ('+name+'’s team'+(dealt?', dealt '+dealt:'')+')' : name+'’s team'+(dealt?' (dealt '+dealt+')':''))+':\n'+team().map(function(c){ return '- '+c.ch+(c.n&&c.n!==c.ch?': '+c.n:'')+' ['+c.s+']'; }).join('\n');
        var m=document.getElementById('msg');
        (navigator.clipboard&&navigator.clipboard.writeText? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ m.textContent='Copied. Paste it in a message to send it back.'; },
          function(){ m.textContent='Couldn’t copy here. Take a screenshot instead.'; }); }
    });
    document.getElementById('tn').innerHTML='<label class="tnl">Name your team<input id="tname" maxlength="30" placeholder="e.g. Cosmic Smash" value="'+esc(tname)+'"></label>';
    document.addEventListener('input',function(e){ if(e.target.id==='tname'){ tname=e.target.value.trim(); try{ localStorage.setItem(TK,tname); }catch(x){} } });
    // the close-up: the list it walks is the whole hand while picking (cards, then basic actions), the team otherwise
    var zv=null, zEl=document.createElement('div'); zEl.className='zv'; zEl.id='zv'; zEl.hidden=true; zEl.setAttribute('role','dialog'); zEl.setAttribute('aria-modal','true'); zEl.setAttribute('aria-label','Card up close');
    document.body.appendChild(zEl);
    function zList(){ return view==='pick'? D.cards.concat(D.bacs) : team(); }
    function flash(t){ var m=document.getElementById('zmsg')||document.getElementById('msg'); if(m) m.textContent=t; }
    function zRender(dir){ var L=zList(); if(!L.length){ zClose(); return; } if(zv.at>=L.length) zv.at=L.length-1;
      var c=L[zv.at], i=view==='pick'? zv.at : -1, card=i>=0 && i<D.cards.length;
      zEl.innerHTML='<div class="zt"><span>'+(zv.at+1)+' of '+L.length+(keep? ' &middot; picked '+n()+' of '+keep : '')+'</span><button class="zx" data-zx="1" aria-label="Close">&times;</button></div>'
        +'<div class="zs'+(dir? (dir>0?' in-l':' in-r') : '')+'">'+pic(c)+label(c,true)+'</div>'
        +'<div class="zb"><button class="zn" data-zgo="-1" aria-label="Previous card"'+(zv.at>0?'':' disabled')+'>&lsaquo;</button>'
        +(card&&keep? '<button class="pk" data-p="'+i+'" aria-pressed="'+!!picked[i]+'">'+(picked[i]?'&#10003; Picked':'Pick this card')+'</button>' : '<span class="gap">'+(i>=D.cards.length? 'Basic action' : 'Swipe for the next')+'</span>')
        +'<button class="zn" data-zgo="1" aria-label="Next card"'+(zv.at<L.length-1?'':' disabled')+'>&rsaquo;</button></div><div class="msg" id="zmsg"></div>';
    }
    function zOpen(at){ var was=!!zv; zv={at:at}; zEl.hidden=false; document.body.style.overflow='hidden'; zRender();
      if(!was){ try{ history.pushState({zv:1},''); }catch(e){} } }
    function zShut(){ zv=null; zEl.hidden=true; zEl.innerHTML=''; document.body.style.overflow=''; }
    function zClose(){ if(!zv) return; if(history.state && history.state.zv){ history.back(); } else zShut(); }
    window.addEventListener('popstate',function(){ if(zv) zShut(); });
    function zGo(d){ if(!zv) return; var L=zList(), na=zv.at+d; if(na<0||na>=L.length) return; zv.at=na; zRender(d); }
    document.addEventListener('keydown',function(e){ if(!zv) return; if(e.key==='Escape') zClose(); if(e.key==='ArrowRight') zGo(1); if(e.key==='ArrowLeft') zGo(-1); });
    var zx0=null, zy0=null;
    zEl.addEventListener('touchstart',function(e){ zx0=e.touches[0].clientX; zy0=e.touches[0].clientY; },{passive:true});
    zEl.addEventListener('touchend',function(e){ if(zx0==null) return; var dx=e.changedTouches[0].clientX-zx0, dy=e.changedTouches[0].clientY-zy0; zx0=null;
      if(Math.abs(dx)>45 && Math.abs(dx)>1.3*Math.abs(dy)) zGo(dx<0?1:-1); else if(dy>90 && dy>2*Math.abs(dx)) zClose(); });
    var sx=null, sy=null;
    document.addEventListener('touchstart',function(e){ if(view==='swipe' && !zv){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
    document.addEventListener('touchend',function(e){ if(sx==null) return; var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
      if(Math.max(Math.abs(dx),Math.abs(dy))<45) return;
      var d=Math.abs(dx)>Math.abs(dy)? (dx<0?1:-1) : (dy<0?1:-1), T=team(), na=at+d; if(na>=0&&na<T.length){ at=na; render(); } });
    if(sender){
      // opened by the dealer from the app: offer to send the hand, without this flag in the link
      var share=location.href.split('#')[0]+'#'+location.hash.slice(1).split('&').filter(function(kv){ return kv!=='s=1'; }).join('&');
      var text=name+', here is your Dice Masters hand'+(dealt?' from '+dealt.replace(/, \d{4}$/,''):'')+': '+share;
      document.getElementById('send').innerHTML='<div class="send"><p>Send this hand to '+esc(name)+'.</p><div class="bar">'
        +(navigator.share?'<button class="p" data-send="share">Share…</button>':'')
        +'<a'+(navigator.share?'':' class="p"')+' href="sms:?&body='+encodeURIComponent(text)+'">Text message</a>'
        +'<button data-send="copy">Copy link</button></div><div class="msg" id="smsg"></div></div>';
      document.getElementById('send').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; var m=document.getElementById('smsg');
        if(b.dataset.send==='share') navigator.share({title:name+'’s Dice Masters hand', text:text}).then(function(){ m.textContent='Sent.'; },function(){});
        if(b.dataset.send==='copy') (navigator.clipboard? navigator.clipboard.writeText(share) : Promise.reject()).then(function(){ m.textContent='Link copied. Paste it into a text.'; },function(){ m.textContent='Couldn’t copy. Press and hold the address bar to copy it.'; });
      });
    }
    render();
  }).catch(function(){ document.getElementById('t').textContent='Couldn’t load the cards'; document.getElementById('s').textContent='Check the connection and reload.'; });
})();
</script>
</body>
</html>
